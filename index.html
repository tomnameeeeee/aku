<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>For bbup akuu ❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Arial';
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  text-align: center;
  color: white;
}

/* Foto pacar */
.foto {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 5px solid white;
  margin-top: 50px;
  object-fit: cover;
  animation: fadeIn 2s ease;
}

/* Karakter */
.karakter {
  width: 250px;
  margin-top: 20px;
  animation: naikTurun 3s infinite ease-in-out;
}

/* Teks */
h1 {
  margin-top: 20px;
  font-size: 30px;
}

p {
  font-size: 18px;
}

/* Animasi */
@keyframes naikTurun {
  0% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(0); }
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

/* Love jatuh */
.love {
  position: absolute;
  color: pink;
  font-size: 20px;
  animation: jatuh linear infinite;
}

@keyframes jatuh {
  0% { transform: translateY(-10vh); opacity: 1; }
  100% { transform: translateY(100vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- Musik -->
<audio autoplay loop>
  <source src="musik.mp3" type="audio/mp3">
</audio>

<!-- Foto pacar -->
<img src="tasya2.jpg" class="foto">

<h1>Happy Birthday 🎉</h1>
<p>Untuk bbup akuu ❤️</p>

<!-- Karakter -->
<img src="contoh.png" class="karakter">

<script>
// Love jatuh
function createLove() {
  const love = document.createElement("div");
  love.classList.add("love");
  love.innerHTML = "❤️";
  love.style.left = Math.random() * 100 + "vw";
  love.style.animationDuration = (Math.random() * 3 + 2) + "s";
  document.body.appendChild(love);

  setTimeout(() => {
    love.remove();
  }, 5000);
}

setInterval(createLove, 300);
</script>

</body>
</html>
